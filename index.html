<title>WeFORM · Mockup MVP</title>
<script>
// Apre la versione giusta: tablet -> ipad/, telefono e computer -> v3/.
// Si può forzare con ?v=tablet oppure ?v=phone.
(function () {
  var q = (location.search.match(/[?&]v=(tablet|ipad|phone|telefono)/) || [])[1];
  var touch = navigator.maxTouchPoints > 1 || 'ontouchstart' in window;
  var iPadOS = /Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1;
  var shortSide = Math.min(screen.width, screen.height);
  var tablet = iPadOS || /iPad|Tablet/i.test(navigator.userAgent) ||
               (/Android/i.test(navigator.userAgent) && !/Mobile/i.test(navigator.userAgent)) ||
               (touch && shortSide >= 600);
  if (q) tablet = (q === 'tablet' || q === 'ipad');
  location.replace(tablet ? 'ipad/Main.dc.html' : 'v3/Main.dc.html');
})();
</script>
